<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Initiative Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121016">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Initiative">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121016;
    --bg-vignette: radial-gradient(ellipse at 50% -10%, #241c26 0%, #121016 55%);
    --card: #1c1820;
    --card-border: #332a38;
    --parchment: #e8e1d0;
    --parchment-dim: #b8ae9c;
    --blood: #7a1f2b;
    --blood-bright: #a8324a;
    --candle: #c99a3f;
    --candle-glow: rgba(201,154,63,0.55);
    --ink: #0d0b10;
    --danger: #8a2f2f;
    --heal: #3f6e4f;
    --temp: #3a6d8a;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg-vignette);
    color: var(--parchment);
    font-family: 'EB Garamond', serif;
    padding: 18px 14px 90px;
  }
  h1,h2,.mono{ font-family: 'Cinzel', serif; letter-spacing: 0.04em; }
  .mono-num{ font-family: 'IBM Plex Mono', monospace; }

  header{ text-align:center; margin-bottom: 18px; position: relative; }
  /* The header is centred text, so the gear is taken out of flow -- it must not
     shift the title or the round counter off centre. */
  .settings-btn{
    position: absolute; top: -2px; right: 0;
    background: none; border: 1px solid var(--card-border); border-radius: 5px;
    color: var(--parchment-dim); cursor: pointer;
    font-size: 1rem; line-height: 1; padding: 7px 9px;
  }
  .settings-btn:active{ background: var(--card-border); }
  header .title{
    font-size: 1.05rem;
    color: var(--parchment-dim);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin: 0 0 6px;
  }
  header .round{
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--candle);
    text-shadow: 0 0 14px var(--candle-glow);
    margin: 0;
  }

  .list{ display:flex; flex-direction:column; gap: 10px; max-width: 560px; margin: 0 auto; }

  .card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 12px 14px;
    display:flex;
    align-items:center;
    gap: 12px;
    position: relative;
    transition: box-shadow .4s ease, border-color .4s ease, transform .2s ease;
  }
  .card.active{
    border-color: var(--candle);
    box-shadow: 0 0 0 1px var(--candle-glow), 0 0 22px var(--candle-glow);
    animation: flicker 2.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .card.active{ animation: none; }
    .drawer, .drawer-backdrop{ transition: none; }
  }
  @keyframes flicker{
    0%,100%{ box-shadow: 0 0 0 1px var(--candle-glow), 0 0 22px var(--candle-glow); }
    50%{ box-shadow: 0 0 0 1px var(--candle-glow), 0 0 12px var(--candle-glow); }
  }

  .init-badge{
    min-width: 40px;
    text-align:center;
    font-size: 1.3rem;
    color: var(--ink);
    background: var(--parchment);
    border-radius: 5px;
    padding: 4px 2px;
    flex-shrink:0;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
  }
  .init-badge:active{ background: var(--candle); }
  .init-edit{
    width: 46px;
    text-align:center;
    font-size: 1.15rem;
    color: var(--ink);
    background: var(--candle);
    border: 2px solid var(--ink);
    border-radius: 5px;
    padding: 3px 2px;
    flex-shrink:0;
    font-family: 'IBM Plex Mono', monospace;
  }
  .type-tag{ font-size: 0.7rem; color: var(--parchment-dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .type-tag.pc{ color: #6f9bc9; }
  .type-tag.friendly{ color: #6f9f76; }
  .type-tag.enemy{ color: var(--blood-bright); }
  .type-tag.neutral{ color: var(--parchment-dim); }

  .body-col{ flex:1; min-width:0; }
  .name-row{ display:flex; align-items:baseline; gap:8px; }
  .name{ font-size: 1.15rem; font-weight: 600; }
  .hp-row{ display:flex; align-items:center; gap:8px; margin-top:4px; }
  .hp-bar-track{ flex:1; height:7px; background:#2a232c; border-radius: 4px; overflow:hidden; display:flex; }
  .hp-bar-fill{ height:100%; background: var(--heal); transition: width .3s ease, background .3s ease; }
  .hp-bar-fill.low{ background: var(--danger); }
  /* Temp HP rides past maxHp, so the bar is scaled against maxHp + temp and the
     overflow segment gets its own colour rather than extending the green. */
  .hp-bar-fill.temp{ background: var(--temp); }
  .hp-text{ font-size: 0.85rem; color: var(--parchment-dim); white-space:nowrap; }
  /* The HP readout doubles as the maxHp editor, so it is a button wearing the
     span's clothes -- browser button chrome would fight the card. */
  button.hp-text{
    appearance:none; background:none; border:none; padding:0;
    font-family: 'IBM Plex Mono', monospace; cursor:pointer;
  }
  button.hp-text:active{ color: var(--parchment); }
  .hp-edit{
    width: 52px;
    text-align:center;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--candle);
    border: 2px solid var(--ink);
    border-radius: 5px;
    padding: 1px 2px;
    flex-shrink:0;
    font-family: 'IBM Plex Mono', monospace;
  }

  .chips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .chip{
    background: rgba(122,31,43,0.25);
    border: 1px solid var(--blood);
    color: var(--parchment);
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 12px;
    display:flex; align-items:center; gap:5px;
  }
  .chip button{ background:none; border:none; color: var(--parchment-dim); cursor:pointer; font-size:0.8rem; padding:0; }
  /* Rule-derived chips are recomputed from HP on every render and never stored,
     so they carry no remove button -- healing is what clears them. */
  .chip.auto{ background: rgba(201,154,63,0.15); border-color: var(--candle); color: var(--candle); }
  .chip.auto.down{ background: rgba(13,11,16,0.6); border-color: var(--parchment-dim); color: var(--parchment-dim); }
  .chip.conc{ background: rgba(58,109,138,0.25); border-color: var(--temp); }
  .chip-rounds{ color: var(--parchment-dim); font-family:'IBM Plex Mono',monospace; font-size:0.68rem; }

  .controls-col{ display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
  .icon-btn{
    background: none; border: 1px solid var(--card-border); color: var(--parchment-dim);
    width: 30px; height: 26px; border-radius:4px; cursor:pointer; font-size:0.85rem;
  }
  .icon-btn:active{ background: var(--card-border); }

  .hp-adjust{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .hp-adjust input{
    width: 52px; background: var(--ink); border:1px solid var(--card-border); color: var(--parchment);
    border-radius:4px; padding:5px 6px; font-family:'IBM Plex Mono',monospace; text-align:center;
  }
  .hp-adjust button{
    border:none; border-radius:4px; padding: 5px 10px; font-size:0.8rem; cursor:pointer; color:var(--parchment);
  }
  .btn-dmg{ background: var(--danger); }
  .btn-heal{ background: var(--heal); }
  .btn-temp{ background: var(--temp); }
  .btn-cond{ background: #3a3140; }
  .btn-conc{ background: var(--temp); }
  .btn-conc.on{ background: var(--candle); color: var(--ink); }

  .conc-save{
    display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:6px;
    background: rgba(201,154,63,0.12); border:1px solid var(--candle);
    border-radius:5px; padding:6px 9px; font-size:0.8rem; color: var(--candle);
  }
  .conc-save .conc-save-text{ flex:1 1 100%; }
  /* Keep the two answers side by side when the row wraps at phone width. */
  .conc-save-actions{ display:flex; gap:8px; margin-left:auto; }
  .conc-save button{
    border:none; border-radius:4px; padding:4px 11px; font-size:0.78rem; cursor:pointer;
    color: var(--parchment); background:#3a3140;
  }
  .conc-save button.broke{ background: var(--danger); }

  .add-cond-input{
    display:none; gap:6px; margin-top:6px;
  }
  .add-cond-input.open{ display:flex; }
  .add-cond-input input{
    flex:1; background: var(--ink); border:1px solid var(--card-border); color: var(--parchment);
    border-radius:4px; padding:5px 8px; font-size:0.85rem;
  }
  .add-cond-input button{ background: #3a3140; color:var(--parchment); border:none; border-radius:4px; padding:5px 10px; }
  .add-cond-input .cond-rounds{
    flex:0 0 auto; width:56px; text-align:center;
    font-family:'IBM Plex Mono',monospace; font-size:0.8rem;
  }

  .rules-list{ display:flex; flex-direction:column; }
  .rule-row{
    display:flex; align-items:flex-start; gap:10px; padding:10px 4px;
    border-bottom:1px solid var(--card-border); cursor:pointer;
  }
  .rule-row:last-child{ border-bottom:none; }
  .rule-row input{ margin-top:3px; accent-color: var(--candle); flex-shrink:0; }
  .rule-row-text{ flex:1; min-width:0; }
  .rule-row-name{ display:block; }
  .rule-row-hint{ display:block; font-size:0.75rem; color: var(--parchment-dim); margin-top:2px; line-height:1.4; }

  .remove-btn{ color: var(--blood-bright); }

  /* Add-to-encounter drawer.
     The three add forms used to sit stacked under the list and dominated the
     page. They now live in one bottom sheet, opened from the main bar, so the
     combatant list is the only thing competing for attention. */
  .drawer-backdrop{
    position: fixed; inset: 0; background: rgba(8,6,10,0.6);
    opacity: 0; transition: opacity 180ms ease; z-index: 20;
    /* It lingers for the length of the fade-out before `hidden` lands -- don't
       let it swallow taps aimed at the bar underneath in the meantime. */
    pointer-events: none;
  }
  .drawer-backdrop.open{ opacity: 1; pointer-events: auto; }
  .drawer{
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-width: 560px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 10px 10px 0 0;
    box-shadow: 0 -12px 34px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    max-height: 82vh;
    transform: translateY(100%);
    transition: transform 200ms ease;
  }
  /* `display: flex` above outranks the UA stylesheet's [hidden] rule, so the
     attribute needs saying again -- without this the closed sheet's inputs stay
     in the tab order, off-screen. */
  .drawer[hidden]{ display: none; }
  .drawer.open{ transform: translateY(0); }
  .drawer-head{
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--card-border); flex-shrink: 0;
  }
  .drawer-tabs{ display: flex; gap: 6px; flex: 1; min-width: 0; }
  .drawer-title{
    flex: 1; min-width: 0; color: var(--candle);
    font-family: 'Cinzel', serif; font-size: 0.85rem;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .drawer-tab{
    flex: 1; background: none; border: 1px solid transparent; border-radius: 5px;
    color: var(--parchment-dim); cursor: pointer;
    font-family: 'Cinzel', serif; font-size: 0.82rem; letter-spacing: 0.08em;
    padding: 8px 4px; text-transform: uppercase;
  }
  .drawer-tab.active{ background: var(--ink); border-color: var(--card-border); color: var(--candle); }
  .drawer-close{
    flex-shrink: 0; background: none; border: 1px solid var(--card-border); border-radius: 5px;
    color: var(--parchment-dim); cursor: pointer; font-size: 0.9rem; line-height: 1; padding: 8px 10px;
  }
  .drawer-body{ overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; }
  .drawer-panel{ display: none; }
  .drawer-panel.active{ display: block; }
  /* Search is a typing field with a results list under it. Give the panel room so
     the sheet opens tall, keeping the input clear of the on-screen keyboard. */
  .drawer-panel[data-panel="monster"].active{ min-height: 42vh; }

  .btn-add-open{ background: #3a3140; color: var(--candle); border: 1px solid var(--candle) !important; }

  .app-footer{
    max-width: 560px; margin: 22px auto 0; text-align: center;
    font-size: 0.68rem; color: var(--parchment-dim); opacity: 0.75; line-height: 1.5;
  }
  .app-footer a{ color: var(--candle); }
  .form-row{ display:flex; gap:8px; margin-bottom:8px; flex-wrap: wrap; }
  .form-row input, .form-row select{
    background: var(--ink); border: 1px solid var(--card-border); color: var(--parchment);
    border-radius:4px; padding:8px 10px; font-family: 'EB Garamond', serif; font-size:1rem;
  }
  .form-row input[name="name"]{ flex: 2; min-width: 120px; }
  .form-row input[name="init"]{ width: 70px; }
  .form-row input[name="hp"]{ width: 70px; }
  .form-row select{ flex:1; min-width: 90px; }
  .roll-btn{
    background: #3a3140; color: var(--candle); border: 1px solid var(--candle); border-radius:4px;
    padding: 8px 10px; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:0.85rem;
  }
  .add-btn{
    width:100%; background: var(--blood); color: var(--parchment); border:none; border-radius:5px;
    padding: 11px; font-size: 1rem; font-family:'Cinzel',serif; letter-spacing:0.06em; cursor:pointer;
  }
  .party-btn{
    width:100%; background: #3a3140; color: var(--candle); border: 1px solid var(--candle);
    border-radius:5px; padding: 11px; font-size: 1rem; font-family:'Cinzel',serif;
    letter-spacing:0.06em; cursor:pointer;
  }
  .party-btn:disabled{ opacity:0.45; cursor:default; }
  /* When the row wraps at phone width, Save is alone on line two -- let it fill it. */
  #partySaveBtn{ flex-grow:1; }
  .party-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .party-member{
    display:flex; align-items:center; gap:8px;
    background: var(--ink); border:1px solid var(--card-border); border-radius:5px;
    padding:8px 10px;
  }
  .party-member-name{ flex:1; min-width:0; overflow-wrap:anywhere; }
  .party-member-type{ font-size:0.7rem; color: var(--candle); letter-spacing:0.08em; flex-shrink:0; }
  .party-member-remove{
    background:none; border:none; color: var(--parchment-dim); cursor:pointer;
    font-size:1rem; line-height:1; padding:0 4px; flex-shrink:0;
  }
  .party-empty{ color: var(--parchment-dim); font-size:0.85rem; margin-bottom:10px; }

  #bestiarySearch{
    width:100%; background: var(--ink); border: 1px solid var(--card-border); color: var(--parchment);
    border-radius:4px; padding:9px 10px; font-family:'EB Garamond',serif; font-size:1rem;
  }
  .bestiary-results{ margin-top:8px; display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto; }
  .bestiary-item{
    display:flex; align-items:center; gap:8px;
    background: var(--ink); border:1px solid var(--card-border); border-radius:5px;
    padding:8px 10px;
  }
  .bestiary-item-main{
    display:flex; flex-direction:column; gap:2px; min-width:0; flex:1;
    background:none; border:none; text-align:left; cursor:pointer; color: var(--parchment);
    font-family: 'EB Garamond', serif; padding:0;
  }
  .bestiary-item-main:active{ opacity:0.75; }
  .bestiary-item-name{ font-size:0.95rem; }
  .bestiary-item-meta{ font-size:0.72rem; color: var(--parchment-dim); }
  .bestiary-item-source{ font-size:0.68rem; color: var(--candle); }
  .bestiary-qty{
    width: 44px; flex-shrink:0; background: var(--card); border:1px solid var(--card-border);
    color: var(--parchment); border-radius:4px; padding:6px 4px; text-align:center;
    font-family:'IBM Plex Mono',monospace; font-size:0.9rem;
  }
  .bestiary-add-btn{
    flex-shrink:0; background: var(--blood); color: var(--parchment); border:none;
    border-radius:4px; padding:8px 12px; font-family:'Cinzel',serif; font-size:0.78rem;
    letter-spacing:0.04em; cursor:pointer;
  }
  .bestiary-add-btn:active{ background: var(--blood-bright); }
  .bestiary-status{ font-size:0.78rem; color: var(--parchment-dim); margin-top:6px; min-height: 1em; }
  .bestiary-status.error{ color: var(--blood-bright); }
  .bestiary-attribution{ font-size:0.68rem; color: var(--parchment-dim); margin-top:8px; opacity:0.75; }
  .bestiary-attribution a{ color: var(--candle); }

  .bottom-bar{
    position: fixed; bottom:0; left:0; right:0;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    padding: 20px 14px 16px;
    display:flex; gap:10px; justify-content:center;
  }
  .bottom-bar button{
    font-family:'Cinzel',serif; letter-spacing:0.05em; border:none; border-radius:6px; cursor:pointer;
    padding: 13px 18px; font-size: 0.95rem;
  }
  .btn-next{ background: var(--candle); color: var(--ink); flex:1; max-width:280px; font-weight:700; }
  .btn-reset{ background: transparent; color: var(--parchment-dim); border: 1px solid var(--card-border) !important; }
  .btn-reset-confirm{ background: var(--blood); color: var(--parchment); }
  .reset-confirm-text{
    align-self:center; color: var(--parchment-dim); font-size: 0.9rem; margin-right: 4px;
  }

  .empty{ text-align:center; color: var(--parchment-dim); padding: 30px 10px; font-style: italic; }

  .persist-banner{
    display:none;
    max-width: 560px; margin: 0 auto 14px;
    background: rgba(122,31,43,0.18);
    border: 1px solid var(--blood);
    color: var(--parchment-dim);
    font-size: 0.82rem;
    padding: 8px 12px;
    border-radius: 5px;
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <button class="settings-btn" id="rulesOpenBtn" aria-label="Automatic rules" title="Automatic rules">&#9881;</button>
  <p class="title">Initiative Tracker</p>
  <h1 class="round" id="roundDisplay">Round I</h1>
</header>

<div class="persist-banner" id="persistBanner">
  Changes aren't saving right now — the tracker still works, but a reload will lose this encounter. Keep this tab open.
</div>

<div class="list" id="list"></div>

<footer class="app-footer">
  Monster search via <a href="https://open5e.com" target="_blank" rel="noopener">Open5e</a>. Includes material from the D&amp;D SRD, &copy; Wizards of the Coast, CC-BY-4.0.
</footer>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

<aside class="drawer" id="drawer" hidden aria-label="Add to encounter">
  <div class="drawer-head">
    <div class="drawer-tabs" id="drawerTabs" role="tablist">
      <button class="drawer-tab" data-tab="party" role="tab">Party</button>
      <button class="drawer-tab" data-tab="monster" role="tab">Monster</button>
      <button class="drawer-tab" data-tab="custom" role="tab">Custom</button>
    </div>
    <button class="drawer-close" id="drawerCloseBtn" aria-label="Close">&#10005;</button>
  </div>

  <div class="drawer-body">
    <section class="drawer-panel" data-panel="party">
      <div class="party-list" id="partyList"></div>
      <div class="form-row">
        <input type="text" id="partyName" placeholder="Character name" autocomplete="off">
        <select id="partyType">
          <option value="pc">PC</option>
          <option value="friendly">Friendly</option>
          <option value="enemy">Enemy</option>
          <option value="neutral">Neutral</option>
        </select>
        <button class="roll-btn" id="partySaveBtn">+ Save</button>
      </div>
      <button class="party-btn" id="addPartyBtn">&#9876; Add the Party</button>
    </section>

    <section class="drawer-panel" data-panel="monster">
      <div class="form-row">
        <input type="text" id="bestiarySearch" placeholder="Search a monster&hellip; (e.g. wolf)" autocomplete="off">
      </div>
      <div id="bestiaryResults" class="bestiary-results"></div>
      <div id="bestiaryStatus" class="bestiary-status"></div>
    </section>

    <section class="drawer-panel" data-panel="custom">
      <div class="form-row">
        <input type="text" name="name" id="inName" placeholder="Name">
        <select id="inType">
          <option value="pc">PC</option>
          <option value="friendly">Friendly</option>
          <option value="enemy">Enemy</option>
          <option value="neutral">Neutral</option>
        </select>
      </div>
      <div class="form-row">
        <input type="number" name="init" id="inInit" placeholder="Init">
        <button class="roll-btn" id="rollBtn">&#127922; d20</button>
        <input type="number" name="hp" id="inHp" placeholder="HP">
      </div>
      <button class="add-btn" id="addBtn">Add to Encounter</button>
    </section>

  </div>
</aside>

<aside class="drawer" id="rulesDrawer" hidden aria-label="Automatic rules">
  <div class="drawer-head">
    <span class="drawer-title">Automatic Rules</span>
    <button class="drawer-close" id="rulesCloseBtn" aria-label="Close">&#10005;</button>
  </div>
  <div class="drawer-body">
    <div class="rules-list" id="rulesList"></div>
  </div>
</aside>

<div class="bottom-bar" id="resetConfirmBar" style="display:none;">
  <span class="reset-confirm-text">Clear the whole encounter?</span>
  <button class="btn-reset" id="resetCancelBtn">Cancel</button>
  <button class="btn-reset-confirm" id="resetConfirmBtn">Yes, clear it</button>
</div>

<div class="bottom-bar" id="mainBar">
  <button class="btn-reset" id="resetBtn">Reset</button>
  <button class="btn-add-open" id="drawerOpenBtn">+ Add</button>
  <button class="btn-next" id="nextBtn">Next Turn ▸</button>
</div>

<script>
const STORAGE_KEY = 'encounter-state-v1';
// Each automatic rule is opt-out on its own. A missing or unknown key reads as on,
// so state saved before a rule existed picks it up instead of silently disabling it.
const RULE_KEYS = ['bloodied', 'unconscious', 'concentration', 'durations'];
function sanitizeRules(r){
  const src = (r && typeof r === 'object') ? r : {};
  const out = {};
  RULE_KEYS.forEach(k => { out[k] = src[k] !== false; });
  return out;
}

let state = { combatants: [], currentIndex: 0, round: 1, party: [], rules: sanitizeRules(null) };
let editingInitIndex = null;
let editingHpIndex = null;

function sanitizeCombatant(c){
  // Until the rename this was never validated, and it is interpolated into the
  // card as both a class and its text -- so it is pinned to the known set here.
  c.type = sanitizeType(c.type, 'neutral');
  c.init = Number.isFinite(c.init) ? c.init : 0;
  c.hp = Number.isFinite(c.hp) ? c.hp : 0;
  c.maxHp = (Number.isFinite(c.maxHp) && c.maxHp > 0) ? c.maxHp : Math.max(c.hp, 1);
  if(c.hp > c.maxHp) c.maxHp = c.hp;
  // Temp HP is kept out of `hp` so the clamp above never promotes a heal
  // overflow into a permanent maxHp. Stored state may predate the field.
  c.tempHp = (Number.isFinite(c.tempHp) && c.tempHp > 0) ? c.tempHp : 0;
  // Conditions were plain strings before durations existed. Upgrade them in place
  // rather than bumping STORAGE_KEY -- the old shape maps onto the new one without
  // loss, since "no duration" is exactly "lasts until removed by hand".
  c.conditions = Array.isArray(c.conditions) ? c.conditions.map(sanitizeCondition).filter(Boolean) : [];
  c.concentrating = c.concentrating === true;
  c.concSaveDc = (Number.isFinite(c.concSaveDc) && c.concSaveDc > 0) ? c.concSaveDc : 0;
  return c;
}
function sanitizeCondition(cond){
  if(typeof cond === 'string'){
    return cond.trim() ? { text: cond.trim(), rounds: null } : null;
  }
  if(!cond || typeof cond.text !== 'string' || !cond.text.trim()) return null;
  const r = Math.floor(cond.rounds);
  return { text: cond.text.trim(), rounds: (Number.isFinite(r) && r > 0) ? r : null };
}
// The roster is user-created and lives in state, so it rides the same save/load
// path as the encounter. Stored state written before the roster existed has no
// `party` key at all -- default it here rather than assuming it exists.
// A combatant's type is its disposition, not where its stat block came from --
// a bandit is an enemy, not a monster.
const COMBATANT_TYPES = ['pc', 'friendly', 'enemy', 'neutral'];
// Saved state predates the rename. The mapping is a straight one, so it happens
// on load rather than costing a STORAGE_KEY bump: "npc" was the catch-all for
// anyone who was neither the party nor the thing attacking it.
const LEGACY_TYPES = { monster: 'enemy', npc: 'neutral' };
function sanitizeType(t, fallback){
  if(typeof t !== 'string') return fallback;
  const mapped = LEGACY_TYPES[t] || t;
  return COMBATANT_TYPES.includes(mapped) ? mapped : fallback;
}
function sanitizePartyMember(m){
  const name = (m && typeof m.name === 'string') ? m.name.trim() : '';
  return { name, type: sanitizeType(m && m.type, 'pc') };
}
function sanitizeState(){
  state.combatants = state.combatants.map(sanitizeCombatant);
  state.party = Array.isArray(state.party)
    ? state.party.map(sanitizePartyMember).filter(m => m.name)
    : [];
  state.rules = sanitizeRules(state.rules);
  if(!Number.isFinite(state.currentIndex)) state.currentIndex = 0;
  if(!Number.isFinite(state.round)) state.round = 1;
}

const romanMap = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
function toRoman(n){
  let res=''; for(const [v,s] of romanMap){ while(n>=v){ res+=s; n-=v; } } return res || 'I';
}

let persistenceOk = true;
let saveRetryTimer = null;
let saveDebounceTimer = null;
let saveInFlight = false;
let savePending = false;

function setPersistenceBanner(ok){
  const el = document.getElementById('persistBanner');
  if(!el) return;
  el.style.display = ok ? 'none' : 'block';
}

function hasLocalStorage(){
  try{
    const t = '__test__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}

function scheduleSave(){
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(saveStateNow, 300);
}

async function saveStateNow(){
  sanitizeState();

  if(!window.storage){
    // Standalone file (opened outside Claude.ai) -- fall back to this browser's
    // localStorage. Note: this only persists on this device/browser, not across others.
    if(hasLocalStorage()){
      try{
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        persistenceOk = true;
        setPersistenceBanner(true);
      }catch(e){
        console.error('localStorage save failed', e);
        persistenceOk = false;
        setPersistenceBanner(false);
      }
    } else {
      persistenceOk = false;
      setPersistenceBanner(false);
    }
    return;
  }

  if(saveInFlight){ savePending = true; return; }
  saveInFlight = true;
  try{
    const res = await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    if(res){
      persistenceOk = true;
      setPersistenceBanner(true);
    } else {
      throw new Error('empty response');
    }
  }catch(e){
    console.error('save failed', e);
    persistenceOk = false;
    setPersistenceBanner(false);
    clearTimeout(saveRetryTimer);
    saveRetryTimer = setTimeout(scheduleSave, 3000);
  }finally{
    saveInFlight = false;
    if(savePending){ savePending = false; scheduleSave(); }
  }
}

async function loadState(){
  if(!window.storage){
    // Standalone file context -- read from localStorage instead.
    if(hasLocalStorage()){
      try{
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if(raw){ state = JSON.parse(raw); }
        setPersistenceBanner(true);
      }catch(e){
        console.error('localStorage load failed', e);
        setPersistenceBanner(false);
      }
    } else {
      setPersistenceBanner(false);
    }
    sanitizeState();
    render();
    return;
  }
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){ state = JSON.parse(res.value); }
    setPersistenceBanner(true);
  }catch(e){
    // No saved state yet is expected (throws on missing key).
  }
  sanitizeState();
  render();
}

const RULE_LABELS = {
  bloodied:      ['Mark Bloodied', 'Shows a Bloodied chip at half hit points or less.'],
  unconscious:   ['Mark Unconscious', 'Shows an Unconscious chip at 0 hit points.'],
  concentration: ['Concentration saves', 'Track who is concentrating and prompt a CON save when they take damage.'],
  durations:     ['Condition durations', 'Let a condition run for a number of rounds, ticking down at the end of that combatant\u2019s turn.']
};
function renderRules(){
  const wrap = document.getElementById('rulesList');
  wrap.innerHTML = RULE_KEYS.map(k => `
    <label class="rule-row">
      <input type="checkbox" data-rule="${k}" ${state.rules[k] ? 'checked' : ''}>
      <span class="rule-row-text">
        <span class="rule-row-name">${RULE_LABELS[k][0]}</span>
        <span class="rule-row-hint">${RULE_LABELS[k][1]}</span>
      </span>
    </label>`).join('');
  wrap.querySelectorAll('[data-rule]').forEach(cb => cb.addEventListener('change', () => {
    state.rules[cb.dataset.rule] = cb.checked;
    // Turning the rule off only hides these, so clear them too -- otherwise a
    // pending save from rounds ago reappears the moment it is switched back on.
    if(cb.dataset.rule === 'concentration' && !cb.checked){
      state.combatants.forEach(c => { c.concentrating = false; c.concSaveDc = 0; });
    }
    scheduleSave(); render();
  }));
}

function sortByInit(){
  state.combatants.sort((a,b)=> b.init - a.init);
}

function render(){
  sanitizeState();
  const list = document.getElementById('list');
  document.getElementById('roundDisplay').textContent = 'Round ' + toRoman(state.round);
  renderParty();
  renderRules();

  if(state.combatants.length === 0){
    list.innerHTML = '<div class="empty">No combatants yet. The mist stirs, but nothing waits within it.</div>';
    return;
  }

  list.innerHTML = state.combatants.map((c, i) => {
    const temp = c.tempHp || 0;
    const barTotal = (c.maxHp > 0 ? c.maxHp : 1) + temp;
    const hpPct = Math.max(0, Math.min(100, (c.hp / barTotal) * 100));
    const tempPct = Math.max(0, Math.min(100 - hpPct, (temp / barTotal) * 100));
    // "Low" tracks real hit points -- a pile of temp HP shouldn't make a dying
    // combatant read as healthy.
    const lowClass = (c.maxHp > 0 ? (c.hp / c.maxHp) * 100 : 100) <= 30 ? 'low' : '';
    // Bloodied and Unconscious are derived from HP here rather than stored in
    // `conditions`: they cannot drift out of step with the bar, cannot be removed
    // by mistake, and a heal clears them on its own. Temp HP is left out of the
    // fraction for the same reason `lowClass` above ignores it.
    const auto = [];
    if(state.rules.unconscious && c.hp === 0){
      auto.push('<span class="chip auto down">Unconscious</span>');
    } else if(state.rules.bloodied && c.hp > 0 && c.hp * 2 <= c.maxHp){
      auto.push('<span class="chip auto">Bloodied</span>');
    }
    if(state.rules.concentration && c.concentrating){
      auto.push('<span class="chip conc">Concentrating</span>');
    }
    const chips = auto.join('') + (c.conditions||[]).map((cond, ci) =>
      `<span class="chip">${escapeHtml(cond.text)}${
        (state.rules.durations && cond.rounds !== null) ? `<span class="chip-rounds">${cond.rounds}</span>` : ''
      }<button data-remove-cond="${i}:${ci}">✕</button></span>`
    ).join('');
    const concSave = (state.rules.concentration && c.concSaveDc) ? `
        <div class="conc-save">
          <span class="conc-save-text">Concentration &mdash; CON save DC ${c.concSaveDc}</span>
          <span class="conc-save-actions">
            <button data-conc-held="${i}">Held</button>
            <button class="broke" data-conc-broke="${i}">Broke</button>
          </span>
        </div>` : '';
    return `
    <div class="card ${i === state.currentIndex ? 'active' : ''}">
      ${i === editingInitIndex
        ? `<input type="number" class="init-edit mono-num" id="initEdit-${i}" value="${c.init}" inputmode="numeric">`
        : `<button class="init-badge mono-num" data-edit-init="${i}">${c.init}</button>`
      }
      <div class="body-col">
        <div class="name-row">
          <span class="name">${escapeHtml(c.name)}</span>
          <span class="type-tag ${escapeHtml(c.type)}">${escapeHtml(c.type)}</span>
        </div>
        <div class="hp-row">
          <div class="hp-bar-track"><div class="hp-bar-fill ${lowClass}" style="width:${hpPct}%"></div><div class="hp-bar-fill temp" style="width:${tempPct}%"></div></div>
          ${i === editingHpIndex
            ? `<input type="number" class="hp-edit mono-num" id="hpEdit-${i}" value="${c.maxHp}" inputmode="numeric" min="1">`
            : `<button class="hp-text mono-num" data-edit-hp="${i}" title="Edit max HP">${c.hp}/${c.maxHp}${temp > 0 ? ' +' + temp : ''}</button>`
          }
        </div>
        <div class="chips">${chips}</div>${concSave}
        <div class="hp-adjust">
          <input type="number" placeholder="amt" id="amt-${i}">
          <button class="btn-dmg" data-dmg="${i}">Dmg</button>
          <button class="btn-heal" data-heal="${i}">Heal</button>
          <button class="btn-temp" data-temp="${i}">Temp</button>
          <button class="btn-cond" data-cond="${i}">+ Cond</button>
          ${state.rules.concentration
            ? `<button class="btn-conc ${c.concentrating ? 'on' : ''}" data-conc="${i}">&#9670; Conc</button>`
            : ''}
        </div>
        <div class="add-cond-input" id="condInput-${i}">
          <input type="text" placeholder="e.g. poisoned" id="condText-${i}">
          ${state.rules.durations
            ? `<input type="number" class="cond-rounds" placeholder="rds" id="condRounds-${i}" inputmode="numeric" min="1">`
            : ''}
          <button data-save-cond="${i}">Add</button>
        </div>
      </div>
      <div class="controls-col">
        <button class="icon-btn" data-up="${i}">▲</button>
        <button class="icon-btn" data-down="${i}">▼</button>
        <button class="icon-btn remove-btn" data-remove="${i}">✕</button>
      </div>
    </div>`;
  }).join('');

  attachCardListeners();

  if(editingInitIndex !== null){
    const inp = document.getElementById('initEdit-' + editingInitIndex);
    if(inp){ inp.focus(); inp.select(); }
  }

  if(editingHpIndex !== null){
    const inp = document.getElementById('hpEdit-' + editingHpIndex);
    if(inp){ inp.focus(); inp.select(); }
  }
}

// Lowering maxHp has to pull current HP down with it: `sanitizeCombatant` raises
// maxHp back up to hp on every save, so an unclamped decrease would silently undo
// itself. Floor at 1 for the same reason -- maxHp <= 0 gets replaced there too.
function commitHpEdit(i){
  const input = document.getElementById('hpEdit-' + i);
  if(!input){ editingHpIndex = null; return; }
  const val = parseInt(input.value, 10);
  if(Number.isFinite(val)){
    const c = state.combatants[i];
    c.maxHp = Math.max(1, val);
    c.hp = Math.min(c.hp, c.maxHp);
  }
  editingHpIndex = null;
  scheduleSave(); render();
}

function commitInitEdit(i){
  const input = document.getElementById('initEdit-' + i);
  if(!input){ editingInitIndex = null; return; }
  const val = parseInt(input.value, 10);
  const activeCombatant = state.combatants[state.currentIndex];
  if(Number.isFinite(val)) state.combatants[i].init = val;
  sortByInit();
  const newIndex = state.combatants.indexOf(activeCombatant);
  state.currentIndex = newIndex >= 0 ? newIndex : 0;
  editingInitIndex = null;
  scheduleSave(); render();
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function attachCardListeners(){
  document.querySelectorAll('[data-edit-init]').forEach(b => b.addEventListener('click', () => {
    editingInitIndex = +b.dataset.editInit;
    render();
  }));
  document.querySelectorAll('.init-edit').forEach(inp => {
    const i = +inp.id.replace('initEdit-', '');
    inp.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ inp.blur(); commitInitEdit(i); }
      if(e.key === 'Escape'){ editingInitIndex = null; render(); }
    });
    inp.addEventListener('blur', () => commitInitEdit(i));
  });
  document.querySelectorAll('[data-edit-hp]').forEach(b => b.addEventListener('click', () => {
    editingHpIndex = +b.dataset.editHp;
    render();
  }));
  document.querySelectorAll('.hp-edit').forEach(inp => {
    const i = +inp.id.replace('hpEdit-', '');
    inp.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ inp.blur(); commitHpEdit(i); }
      if(e.key === 'Escape'){ editingHpIndex = null; render(); }
    });
    inp.addEventListener('blur', () => commitHpEdit(i));
  });
  document.querySelectorAll('[data-dmg]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.dmg;
    const amt = +document.getElementById('amt-'+i).value || 1;
    const c = state.combatants[i];
    // Temp HP soaks damage first, as in 5e.
    const fromTemp = Math.min(c.tempHp || 0, amt);
    c.tempHp = (c.tempHp || 0) - fromTemp;
    c.hp = Math.max(0, c.hp - (amt - fromTemp));
    // The DC keys off damage *taken*, so it uses the full amount -- temp HP soaks
    // the hit but you still took it. Dropping to 0 ends concentration outright,
    // with no save to make.
    if(state.rules.concentration && c.concentrating && amt > 0){
      if(c.hp === 0){ c.concentrating = false; c.concSaveDc = 0; }
      else c.concSaveDc = Math.max(10, Math.floor(amt / 2));
    }
    scheduleSave(); render();
  }));
  document.querySelectorAll('[data-heal]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.heal;
    const amt = +document.getElementById('amt-'+i).value || 1;
    const c = state.combatants[i];
    c.hp = Math.min(c.maxHp, c.hp + amt);
    scheduleSave(); render();
  }));
  // Temp HP is granted outright, not earned by overhealing -- a combatant can
  // pick it up at any HP, so it gets its own button rather than riding on Heal.
  document.querySelectorAll('[data-temp]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.temp;
    const amt = +document.getElementById('amt-'+i).value || 1;
    const c = state.combatants[i];
    c.tempHp = Math.max(0, (c.tempHp || 0) + amt);
    scheduleSave(); render();
  }));
  document.querySelectorAll('[data-cond]').forEach(b => b.addEventListener('click', () => {
    const el = document.getElementById('condInput-'+b.dataset.cond);
    el.classList.toggle('open');
  }));
  document.querySelectorAll('[data-save-cond]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.saveCond;
    const txt = document.getElementById('condText-'+i).value.trim();
    if(txt){
      const roundsEl = document.getElementById('condRounds-'+i);
      const rounds = roundsEl ? Math.floor(+roundsEl.value) : 0;
      state.combatants[i].conditions = state.combatants[i].conditions || [];
      state.combatants[i].conditions.push({ text: txt, rounds: rounds > 0 ? rounds : null });
      scheduleSave(); render();
    }
  }));
  document.querySelectorAll('[data-conc]').forEach(b => b.addEventListener('click', () => {
    const c = state.combatants[+b.dataset.conc];
    c.concentrating = !c.concentrating;
    if(!c.concentrating) c.concSaveDc = 0;
    scheduleSave(); render();
  }));
  document.querySelectorAll('[data-conc-held]').forEach(b => b.addEventListener('click', () => {
    state.combatants[+b.dataset.concHeld].concSaveDc = 0;
    scheduleSave(); render();
  }));
  document.querySelectorAll('[data-conc-broke]').forEach(b => b.addEventListener('click', () => {
    const c = state.combatants[+b.dataset.concBroke];
    c.concSaveDc = 0;
    c.concentrating = false;
    scheduleSave(); render();
  }));
  document.querySelectorAll('[data-remove-cond]').forEach(b => b.addEventListener('click', () => {
    const [i, ci] = b.dataset.removeCond.split(':').map(Number);
    state.combatants[i].conditions.splice(ci, 1);
    scheduleSave(); render();
  }));
  document.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.up;
    if(i > 0){
      swapAndFixActive(i, i-1);
      scheduleSave(); render();
    }
  }));
  document.querySelectorAll('[data-down]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.down;
    if(i < state.combatants.length - 1){
      swapAndFixActive(i, i+1);
      scheduleSave(); render();
    }
  }));
  document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.remove;
    state.combatants.splice(i, 1);
    if(state.currentIndex > i) state.currentIndex--;
    if(state.currentIndex >= state.combatants.length) state.currentIndex = 0;
    scheduleSave(); render();
  }));
}

function swapAndFixActive(i, j){
  const tmp = state.combatants[i];
  state.combatants[i] = state.combatants[j];
  state.combatants[j] = tmp;
  if(state.currentIndex === i) state.currentIndex = j;
  else if(state.currentIndex === j) state.currentIndex = i;
}

// --- Dice formula roller, e.g. "6d10+40" or "2d8-2" ---
function rollDiceFormula(formula) {
  if (!formula) return null;
  const cleaned = String(formula).replace(/\s+/g, '').toLowerCase();
  const termRegex = /([+-]?)(\d*d\d+|\d+)/g;
  let total = 0, matched = false, m;
  while ((m = termRegex.exec(cleaned))) {
    matched = true;
    const sign = m[1] === '-' ? -1 : 1;
    const token = m[2];
    if (token.includes('d')) {
      const [numStr, sidesStr] = token.split('d');
      const num = numStr === '' ? 1 : parseInt(numStr, 10);
      const sides = parseInt(sidesStr, 10);
      for (let i = 0; i < num; i++) total += sign * (Math.floor(Math.random() * sides) + 1);
    } else {
      total += sign * parseInt(token, 10);
    }
  }
  return matched ? Math.max(1, total) : null;
}

// --- Live search against the Open5e v2 API ---
// Official Wizards-published sources get priority in results over third-party OGL books,
// since those are what most people expect to find first.
const CORE_DOCUMENT_KEYS = ['srd-2024', 'srd-2014', 'wotc-srd'];

// Compact abbreviated codes for source books, in the style used by D&D Beyond
// (e.g. "MM'25", "ToB"). Falls back to auto-generated initials for anything unmapped.
const DOCUMENT_ABBREV = {
  'srd-2024': "MM'25 (SRD)",
  'srd-2014': "MM'14 (SRD)",
  'wotc-srd': "MM'14 (SRD)",
  'a5e-mm': 'A5E MM',
  'menagerie': 'A5E MM',
  'tob': 'ToB',
  'tob2': 'ToB2',
  'tob3': 'ToB3',
  'tob-2023': 'ToB',
  'cc': 'CC',
  'blackflag': 'BFRD',
  'bfrd': 'BFRD'
};

function abbreviateSource(key, fullName) {
  if (key && DOCUMENT_ABBREV[key]) return DOCUMENT_ABBREV[key];
  if (!fullName) return key || '?';
  const initials = fullName.split(/\s+/).filter(w => /^[A-Z]/.test(w)).map(w => w[0]).join('');
  return initials.length >= 2 ? initials : fullName.slice(0, 8);
}

async function searchLiveBestiary(query) {
  const url = 'https://api.open5e.com/v2/creatures/?name__icontains=' +
    encodeURIComponent(query) + '&limit=50&fields=name,hit_dice,modifiers,challenge_rating,document';
  const res = await fetch(url);
  if (!res.ok) throw new Error('bad response');
  const data = await res.json();
  const all = (data.results || []).map(c => {
    const key = c.document ? c.document.key : null;
    return {
      name: c.name,
      hitDice: c.hit_dice,
      dexMod: c.modifiers ? c.modifiers.dexterity : 0,
      cr: c.challenge_rating,
      source: abbreviateSource(key, c.document ? c.document.name : null),
      sourceKey: key
    };
  });

  // De-dupe identical name+source pairs, then sort: core rulebooks first (in the
  // priority order above), then everything else alphabetically by source, then by name.
  const seen = new Set();
  const deduped = all.filter(m => {
    const k = m.name + '|' + m.sourceKey;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  deduped.sort((a, b) => {
    const aCore = CORE_DOCUMENT_KEYS.indexOf(a.sourceKey);
    const bCore = CORE_DOCUMENT_KEYS.indexOf(b.sourceKey);
    const aRank = aCore === -1 ? CORE_DOCUMENT_KEYS.length : aCore;
    const bRank = bCore === -1 ? CORE_DOCUMENT_KEYS.length : bCore;
    if (aRank !== bRank) return aRank - bRank;
    if (a.source !== b.source) return (a.source || '').localeCompare(b.source || '');
    return a.name.localeCompare(b.name);
  });

  return deduped.slice(0, 16);
}

let bestiaryDebounce = null;
function renderBestiaryResults(items, sourceLabel) {
  const box = document.getElementById('bestiaryResults');
  if (!items.length) { box.innerHTML = ''; return; }
  box.innerHTML = items.map((m, i) => `
    <div class="bestiary-item">
      <button class="bestiary-item-main" data-bestiary-index="${i}">
        <span class="bestiary-item-name">${escapeHtml(m.name)}</span>
        <span class="bestiary-item-meta">CR ${m.cr ?? '?'} · ${escapeHtml(m.hitDice || '—')}</span>
        <span class="bestiary-item-source">${escapeHtml(m.source || sourceLabel)}</span>
      </button>
      <input type="number" class="bestiary-qty" id="bestiaryQty-${i}" value="1" min="1" max="20" inputmode="numeric">
      <button class="bestiary-add-btn" data-bestiary-add="${i}">Add</button>
    </div>
  `).join('');
  window.__bestiaryLastResults = items;
  // Tapping the name/CR area adds one immediately (fast path for a single creature).
  document.querySelectorAll('[data-bestiary-index]').forEach(b => {
    b.addEventListener('click', () => {
      const m = window.__bestiaryLastResults[+b.dataset.bestiaryIndex];
      addMonsterFromBestiary(m, 1);
    });
  });
  // The Add button respects whatever quantity is in the adjacent field.
  document.querySelectorAll('[data-bestiary-add]').forEach(b => {
    b.addEventListener('click', () => {
      const i = +b.dataset.bestiaryAdd;
      const m = window.__bestiaryLastResults[i];
      const qtyInput = document.getElementById('bestiaryQty-' + i);
      const qty = Math.max(1, Math.min(20, +qtyInput.value || 1));
      addMonsterFromBestiary(m, qty);
    });
  });
}

function addMonsterFromBestiary(m, count) {
  const n = Math.max(1, count || 1);
  for (let i = 0; i < n; i++) {
    const rolledHp = rollDiceFormula(m.hitDice) || 1;
    const rolledInit = Math.floor(Math.random() * 20) + 1 + (m.dexMod || 0);
    const existingNames = state.combatants.map(c => c.name.toLowerCase());
    let name = m.name;
    if (existingNames.includes(name.toLowerCase())) {
      let k = 2;
      while (existingNames.includes(`${m.name} ${k}`.toLowerCase())) k++;
      name = `${m.name} ${k}`;
    }
    state.combatants.push({ name, type: 'enemy', init: rolledInit, hp: rolledHp, maxHp: rolledHp, tempHp: 0, conditions: [] });
  }
  sortByInit();
  document.getElementById('bestiarySearch').value = '';
  document.getElementById('bestiaryResults').innerHTML = '';
  document.getElementById('bestiaryStatus').textContent = '';
  scheduleSave(); render();
}

document.getElementById('bestiarySearch').addEventListener('input', (e) => {
  const query = e.target.value;
  clearTimeout(bestiaryDebounce);
  const statusEl = document.getElementById('bestiaryStatus');
  if (!query.trim()) {
    document.getElementById('bestiaryResults').innerHTML = '';
    statusEl.textContent = '';
    return;
  }
  bestiaryDebounce = setTimeout(async () => {
    statusEl.textContent = 'Searching…';
    statusEl.classList.remove('error');
    try {
      const results = await searchLiveBestiary(query);
      document.getElementById('bestiaryResults').innerHTML = '';
      if (results.length) {
        renderBestiaryResults(results, 'Open5e');
        statusEl.textContent = '';
      } else {
        statusEl.textContent = 'No matches — add it manually below instead.';
      }
    } catch (err) {
      document.getElementById('bestiaryResults').innerHTML = '';
      statusEl.textContent = "Can't reach the live bestiary right now — add it manually below instead.";
      statusEl.classList.add('error');
    }
  }, 400);
});


function renderParty(){
  const wrap = document.getElementById('partyList');
  if(state.party.length === 0){
    wrap.innerHTML = '<div class="party-empty">No party yet. Add your characters below \u2014 they are saved on this device and survive a Reset.</div>';
  } else {
    wrap.innerHTML = state.party.map((m, i) =>
      '<div class="party-member">' +
        '<span class="party-member-name">' + escapeHtml(m.name) + '</span>' +
        '<span class="party-member-type">' + escapeHtml(m.type.toUpperCase()) + '</span>' +
        '<button class="party-member-remove" data-party-remove="' + i + '" title="Remove from party">\u2715</button>' +
      '</div>').join('');
  }
  document.getElementById('addPartyBtn').disabled = state.party.length === 0;
  // Full redraw, same as the combatant cards -- re-bind every time, hold no refs.
  wrap.querySelectorAll('[data-party-remove]').forEach(b => b.addEventListener('click', () => {
    state.party.splice(+b.dataset.partyRemove, 1);
    scheduleSave(); renderParty();
  }));
}

function savePartyMember(){
  const input = document.getElementById('partyName');
  const name = input.value.trim();
  if(!name) return;
  const type = document.getElementById('partyType').value;
  if(!state.party.some(m => m.name.toLowerCase() === name.toLowerCase())){
    state.party.push({ name, type });
  }
  input.value = '';
  input.focus();
  scheduleSave(); renderParty();
}

document.getElementById('partySaveBtn').addEventListener('click', savePartyMember);
document.getElementById('partyName').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); savePartyMember(); }
});

// Add-to-encounter drawer. Which tab is showing and whether the sheet is open
// are view chrome, not encounter data -- they stay out of `state` so nothing
// new has to be defaulted in sanitizeState() or force a STORAGE_KEY bump.
// The drawer lives outside #list, so it survives render() and is bound once here
// rather than in attachCardListeners().
let drawerTab = 'party';
const drawerEl = document.getElementById('drawer');
const drawerBackdropEl = document.getElementById('drawerBackdrop');
const rulesDrawerEl = document.getElementById('rulesDrawer');

function setDrawerTab(tab){
  drawerTab = tab;
  document.querySelectorAll('.drawer-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.querySelectorAll('.drawer-panel').forEach(pnl => {
    pnl.classList.toggle('active', pnl.dataset.panel === tab);
  });
}

// The add drawer and the rules sheet are the same bottom sheet with different
// contents, so they share one open/close pair and one backdrop.
function openSheet(el){
  el.hidden = false;
  drawerBackdropEl.hidden = false;
  // Let the element lay out at translateY(100%) before the class flips it to 0,
  // otherwise the browser has nothing to animate from. Two frames, because the
  // first only gets it out of display:none -- style is not settled until the next.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.classList.add('open');
    drawerBackdropEl.classList.add('open');
  }));
  document.getElementById('mainBar').style.display = 'none';
}

function closeSheet(el){
  if(el.hidden) return;
  el.classList.remove('open');
  drawerBackdropEl.classList.remove('open');
  setTimeout(() => {
    if(el.classList.contains('open')) return;
    el.hidden = true;
    drawerBackdropEl.hidden = true;
  }, 200);
  // Only restore the main bar if the reset confirmation isn't the one showing.
  if(document.getElementById('resetConfirmBar').style.display === 'none'){
    document.getElementById('mainBar').style.display = '';
  }
}

function openDrawer(tab){
  setDrawerTab(tab || drawerTab);
  openSheet(drawerEl);
}

function closeDrawer(){ closeSheet(drawerEl); }

document.getElementById('drawerOpenBtn').addEventListener('click', () => openDrawer());
document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
document.getElementById('rulesOpenBtn').addEventListener('click', () => openSheet(rulesDrawerEl));
document.getElementById('rulesCloseBtn').addEventListener('click', () => closeSheet(rulesDrawerEl));
// The backdrop sits under whichever sheet is up, so it dismisses either.
drawerBackdropEl.addEventListener('click', () => {
  closeDrawer();
  closeSheet(rulesDrawerEl);
});
document.querySelectorAll('.drawer-tab').forEach(b => {
  b.addEventListener('click', () => setDrawerTab(b.dataset.tab));
});
document.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape') return;
  closeDrawer();
  closeSheet(rulesDrawerEl);
});
setDrawerTab(drawerTab);

document.getElementById('addPartyBtn').addEventListener('click', () => {
  const existingNames = new Set(state.combatants.map(c => c.name.trim().toLowerCase()));
  state.party.forEach(p => {
    if(existingNames.has(p.name.toLowerCase())) return;
    // 2/2 rather than 0/1: the DM fills in the real total from the HP readout, and
    // in the meantime both derived chips stay reachable. At maxHp 1 nothing is ever
    // bloodied (hp*2 <= maxHp cannot hold above 0) and hp 0 reads as Unconscious
    // the moment the party is added.
    state.combatants.push({ name: p.name, type: p.type, init: 0, hp: 2, maxHp: 2, tempHp: 0, conditions: [] });
  });
  sortByInit();
  scheduleSave(); render();
  closeDrawer();
});

document.getElementById('rollBtn').addEventListener('click', () => {
  document.getElementById('inInit').value = Math.floor(Math.random()*20) + 1;
});

document.getElementById('addBtn').addEventListener('click', () => {
  const name = document.getElementById('inName').value.trim();
  const type = document.getElementById('inType').value;
  const init = +document.getElementById('inInit').value || 0;
  const hp = +document.getElementById('inHp').value || 0;
  if(!name) return;
  state.combatants.push({ name, type, init, hp, maxHp: hp || 1, tempHp: 0, conditions: [] });
  sortByInit();
  document.getElementById('inName').value = '';
  document.getElementById('inInit').value = '';
  document.getElementById('inHp').value = '';
  scheduleSave(); render();
  closeDrawer();
});

// A duration runs out at the end of the turn of whoever carries it, so the tick
// lands on the combatant being left behind, not the one coming up.
function tickConditions(i){
  if(!state.rules.durations) return;
  const c = state.combatants[i];
  if(!c) return;
  c.conditions = c.conditions.filter(cond => {
    if(cond.rounds === null) return true;
    cond.rounds--;
    return cond.rounds > 0;
  });
}

document.getElementById('nextBtn').addEventListener('click', () => {
  if(state.combatants.length === 0) return;
  tickConditions(state.currentIndex);
  state.currentIndex++;
  if(state.currentIndex >= state.combatants.length){
    state.currentIndex = 0;
    state.round++;
  }
  scheduleSave(); render();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('mainBar').style.display = 'none';
  document.getElementById('resetConfirmBar').style.display = 'flex';
});

document.getElementById('resetCancelBtn').addEventListener('click', () => {
  document.getElementById('resetConfirmBar').style.display = 'none';
  document.getElementById('mainBar').style.display = 'flex';
});

document.getElementById('resetConfirmBtn').addEventListener('click', () => {
  // The roster is not part of the encounter -- Reset clears combatants, not the party.
  // Neither the roster nor the rule settings belong to one encounter.
  state = { combatants: [], currentIndex: 0, round: 1, party: state.party, rules: state.rules };
  editingInitIndex = null;
  editingHpIndex = null;
  document.getElementById('resetConfirmBar').style.display = 'none';
  document.getElementById('mainBar').style.display = 'flex';
  scheduleSave(); render();
});

loadState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {
      // Non-fatal: the app still works fully online without the service worker,
      // it just won't have offline caching.
    });
  });
}
</script>
</body>
